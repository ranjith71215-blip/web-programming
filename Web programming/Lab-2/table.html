<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>

    <style>
        table {
            margin:auto;
            border: 2px solid black;
            border-collapse: separate;
            border-spacing: 3px;
            background-color: orange;
            width: 640px;
        }

        th, td {
            border: 2px solid black;
            background-color: orange;
            padding: 4px;
            font-size: 18px;
        }

        th {
            font-weight: bold;
            text-align: center;
        }

        td {
            text-align: left;
        }

        .total {
            text-align: left;
            font-weight: normal;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th>Sl.No.</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Phone no.</th>
    </tr>

    <tr>
        <td>1</td>
        <td>Ramesh</td>
        <td rowspan="2">m</td>
        <td>9837472723</td>
    </tr>

    <tr>
        <td>2</td>
        <td>Suresh</td>
        <td>9837472724</td>
    </tr>

    <tr>
        <td>3</td>
        <td>Rajesh</td>
        <td>t</td>
        <td>9837472725</td>
    </tr>

    <tr>
        <td colspan="2" class="total">Total Students : 3</td>
    </tr>
</table>

</body>
</html>
